# Tooling configuration for the NEXUS Python services.
#
# The services are organised as sibling top-level packages that run inside a
# single FastAPI process (no microservices):
#   market_data, quant, risk, ai, backtesting, paper_trading  -> services/
#   app (the FastAPI application)                             -> services/api/
# Both directories must be on PYTHONPATH; scripts/py.mjs and the Dockerfile
# set this up, and pytest does it via `pythonpath` below.

[project]
name = "nexus-services"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "api"]
testpaths = [
  "market_data/tests",
  "quant/tests",
  "risk/tests",
  "ai/tests",
  "backtesting/tests",
  "paper_trading/tests",
  "api/app/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "S311",   # pseudo-random generators are used for deterministic DEMO data, never for security
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF012", # mutable class attrs on pydantic/SQLAlchemy models are fine
  "SIM108",
  "E501",   # formatter handles line length; long literals are acceptable
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "market_data", "quant", "risk", "ai", "backtesting", "paper_trading"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["(^|/)tests/", "\\.venv"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B311"]
