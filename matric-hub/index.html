<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 25-day NSC rewrite study system for Mathematics and Physical Sciences.">
</head>
<body>
<title>Matric Rewrite HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Left rail on wide screens, bottom tab bar on phones; one
   content column (max 60rem). Jacaranda violet = Maths + app accent, teal =
   Physical Sciences, memo green = ticks/done, marking-pen red = mistakes. */
:root {
  --paper: #fbfafd;
  --card: #ffffff;
  --sunk: #f3f0f9;
  --line: #e5e0ef;
  --ink: #1d1a2e;
  --ink-2: #4a4560;
  --ink-3: #686280;
  --jac: #6b4fd0;
  --jac-soft: #ece6fb;
  --jac-ink: #4b32a8;
  --on-jac: #ffffff;
  --sci: #0b8fa0;
  --sci-soft: #dcf2f4;
  --sci-ink: #065f69;
  --tick: #2e7d4f;
  --tick-soft: #e2f3e8;
  --warn: #9a5a00;
  --warn-soft: #fbefd9;
  --red: #c23b32;
  --red-soft: #fbe7e5;
  --rule: #dfe6f3;
  --margin: #eeb4ae;
  --shadow: 0 1px 2px rgb(29 26 46 / 6%), 0 6px 20px rgb(29 26 46 / 6%);
  --f-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Lexend", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-math: "Cambria Math", "STIX Two Math", "Latin Modern Math", Cambria, "Times New Roman", serif;
  --r: 14px;
  --rail: 15rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14121d;
    --card: #1c1929;
    --sunk: #242034;
    --line: #342f49;
    --ink: #efebf8;
    --ink-2: #c6c0d8;
    --ink-3: #9d96b5;
    --jac: #8b72e8;
    --jac-soft: #2b2450;
    --jac-ink: #bcaaf7;
    --on-jac: #14121d;
    --sci: #1a9ea5;
    --sci-soft: #123538;
    --sci-ink: #74d4d9;
    --tick: #4cc38a;
    --tick-soft: #15301f;
    --warn: #e0a33b;
    --warn-soft: #382a12;
    --red: #f07a6e;
    --red-soft: #3b1c1a;
    --rule: #2b2840;
    --margin: #6b3a3a;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14121d;
  --card: #1c1929;
  --sunk: #242034;
  --line: #342f49;
  --ink: #efebf8;
  --ink-2: #c6c0d8;
  --ink-3: #9d96b5;
  --jac: #8b72e8;
  --jac-soft: #2b2450;
  --jac-ink: #bcaaf7;
  --on-jac: #14121d;
  --sci: #1a9ea5;
  --sci-soft: #123538;
  --sci-ink: #74d4d9;
  --tick: #4cc38a;
  --tick-soft: #15301f;
  --warn: #e0a33b;
  --warn-soft: #382a12;
  --red: #f07a6e;
  --red-soft: #3b1c1a;
  --rule: #2b2840;
  --margin: #6b3a3a;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 25%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--jac-ink); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--jac); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: clamp(1.9rem, 4.6vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.25rem; }
.lead { font-size: 1.08rem; color: var(--ink-2); max-width: 65ch; }
.muted { color: var(--ink-3); }
.small { font-size: 0.875rem; }
.tiny { font-size: 0.78rem; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ─── Shell ─── */
.rail {
  position: fixed; inset: 0 auto 0 0; width: var(--rail);
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 14px 20px;
  border-right: 1px solid var(--line); background: var(--card);
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.12rem; line-height: 1.1; display: block; }
.brand span { font-size: 0.74rem; color: var(--ink-3); }
.nav-a {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px;
  text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: 0.95rem;
}
.nav-a svg { width: 20px; height: 20px; flex: none; }
.nav-a:hover { background: var(--sunk); color: var(--ink); }
.nav-a[aria-current="page"] { background: var(--jac-soft); color: var(--jac-ink); }
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.rail-foot { margin-top: auto; padding: 12px 10px 0; font-size: 0.78rem; color: var(--ink-3); }
.main { margin-left: var(--rail); min-width: 0; }
.topbar { display: none; }
.tabbar { display: none; }
.page { max-width: 60rem; margin: 0 auto; padding: 32px 32px 96px; display: grid; gap: 28px; }
.page > * { min-width: 0; }

@media (max-width: 860px) {
  .rail { display: none; }
  .main { margin-left: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .topbar .brand { padding: 0; }
  .topbar .brand b { font-size: 1rem; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr);
    position: fixed; inset: auto 0 0 0; z-index: 20;
    padding: 6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px);
    background: var(--card); border-top: 1px solid var(--line);
  }
  .tabbar a {
    display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px;
    text-decoration: none; color: var(--ink-3); font-size: 0.7rem; font-weight: 500;
  }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--jac-ink); background: var(--jac-soft); }
  .page { padding: 20px 16px 110px; gap: 22px; }
}

/* ─── Building blocks ─── */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.card.pad-lg { padding: 24px; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 761px) and (max-width: 1000px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 10px; border: 1px solid transparent;
  background: var(--jac); color: var(--on-jac); font-weight: 600; font-size: 0.93rem;
  text-decoration: none; cursor: pointer; line-height: 1.2; min-height: 42px;
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--sunk); filter: none; }
.btn.sci { background: var(--sci); color: var(--on-jac); }
.btn.sm { padding: 6px 11px; min-height: 34px; font-size: 0.85rem; border-radius: 8px; }
.btn.quiet { background: transparent; color: var(--jac-ink); padding-inline: 8px; }
.btn.quiet:hover { background: var(--jac-soft); filter: none; }
.btn.danger { background: var(--red); color: var(--on-jac); }
.btn svg { width: 16px; height: 16px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px;
  font-size: 0.75rem; font-weight: 600; line-height: 1.6; white-space: nowrap;
  background: var(--sunk); color: var(--ink-2);
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.9; }
.chip.plain::before { display: none; }
.chip.maths { background: var(--jac-soft); color: var(--jac-ink); }
.chip.phys { background: var(--sci-soft); color: var(--sci-ink); }
.chip.both { background: var(--sunk); color: var(--ink-2); }
.chip.good { background: var(--tick-soft); color: var(--tick); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--red-soft); color: var(--red); }
.chip.gold { background: var(--jac); color: var(--on-jac); }
.chip.gold::before { display: none; }

.ext::after { content: " ↗"; font-size: 0.85em; }

/* ─── Today hero ─── */
.hero { display: grid; gap: 6px; }
.hero .day-of { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 3.6rem); letter-spacing: -0.03em; line-height: 1; }
.hero .day-of small { font-size: 0.42em; font-weight: 700; color: var(--ink-3); letter-spacing: 0; margin-left: 6px; }
.branch-wrap { position: relative; margin-top: 6px; }
.branch { width: 100%; height: auto; display: block; overflow: visible; }
.branch .stem { fill: none; stroke: var(--ink-3); stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
.branch .twig { fill: none; stroke: var(--ink-3); stroke-width: 1.6; stroke-linecap: round; opacity: 0.45; }
.branch .bl { cursor: pointer; }
.branch .bl .petal { fill: var(--card); stroke: var(--ink-3); stroke-width: 1.2; transition: fill 0.3s; }
.branch .bl.part .petal { fill: var(--jac-soft); stroke: var(--jac); }
.branch .bl.done .petal { fill: var(--jac); stroke: var(--jac); }
.branch .bl .eye { fill: var(--paper); }
.branch .bl.done .eye { fill: var(--jac-soft); }
.branch .bl.today .ring { fill: none; stroke: var(--jac); stroke-width: 2; stroke-dasharray: 3 3; }
.branch .bl:hover .petal, .branch .bl:focus-visible .petal { stroke-width: 2.2; }
.branch .bl:focus { outline: none; }
.branch .bl:focus-visible .ring { stroke: var(--ink); stroke-dasharray: none; fill: none; stroke-width: 2; }
.branch text { font-family: var(--f-mono); font-size: 10px; fill: var(--ink-3); }
.legend-row { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.78rem; color: var(--ink-3); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--jac); display: inline-block; }
.legend-row i.done { background: var(--jac); }
.legend-row i.part { background: var(--jac-soft); }
.legend-row i.none { border-color: var(--ink-3); background: var(--card); }

.falling { position: fixed; top: -40px; z-index: 50; pointer-events: none; animation: fall 3.2s cubic-bezier(.3,.1,.5,1) forwards; }
@keyframes fall {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  100% { transform: translate(60px, 105vh) rotate(420deg); opacity: 0.2; }
}

/* ─── Tasks ─── */
.tasks { display: grid; gap: 2px; list-style: none; padding: 0; margin: 0; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 4px; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task .t-body { display: grid; gap: 4px; min-width: 0; }
.task .t-text { font-weight: 500; }
.task.done .t-text { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--tick); text-decoration-thickness: 2px; }
.task .t-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.8rem; color: var(--ink-3); }
.task .t-go { align-self: center; }
@media (max-width: 560px) {
  .task { grid-template-columns: auto minmax(0, 1fr); }
  .task .t-go { grid-column: 2; align-self: start; justify-self: start; margin-top: -4px; }
  .task .t-go:empty { display: none; }
}
.check {
  appearance: none; -webkit-appearance: none; margin: 2px 0 0; width: 26px; height: 26px; border-radius: 8px;
  border: 2px solid var(--ink-3); background: var(--card); cursor: pointer; display: grid; place-items: center; flex: none;
}
.check:checked { background: var(--tick); border-color: var(--tick); }
.check:checked::after { content: "✓"; color: var(--card); font-weight: 800; font-size: 16px; line-height: 1; }
.paper-links { display: flex; flex-wrap: wrap; gap: 6px; }

/* ─── Meters & charts ─── */
.meter { display: grid; gap: 6px; }
.meter .m-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; }
.meter .m-top b { font-weight: 600; white-space: nowrap; }
.meter .bar { height: 10px; border-radius: 99px; background: var(--jac-soft); overflow: hidden; }
.meter .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--jac); min-width: 0; transition: width 0.4s; }
.meter.phys .bar { background: var(--sci-soft); }
.meter.phys .bar > i { background: var(--sci); }
.meter.good .bar { background: var(--tick-soft); }
.meter.good .bar > i { background: var(--tick); }

.minis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .minis { grid-template-columns: minmax(0, 1fr); } }
.mini { border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 8px; display: grid; gap: 4px; position: relative; }
.mini h4 { font-family: var(--f-body); font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.mini .big { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
.mini svg { width: 100%; height: auto; display: block; }
.mini .grid-l { stroke: var(--line); stroke-width: 1; }
.mini .pass-l { stroke: var(--red); stroke-width: 1.5; }
.mini .ax { font-family: var(--f-mono); font-size: 10px; fill: var(--ink-3); }
.mini .val { font-family: var(--f-body); font-size: 11px; font-weight: 600; fill: var(--ink); }
.mini .col { cursor: default; }
.mini .col rect.hit { fill: transparent; }
.mini .col:hover rect.m, .mini .col:focus rect.m { filter: brightness(1.15); }
.mini .col:focus { outline: none; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--paper);
  font-size: 0.78rem; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%);
}
.tip b { font-size: 0.9rem; }

/* ─── Topic cards ─── */
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 14px; }
.tcard {
  display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: var(--r);
  background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--ink); position: relative;
}
.tcard:hover { border-color: var(--jac); box-shadow: var(--shadow); }
.tcard.phys:hover { border-color: var(--sci); }
.tcard h3 { font-size: 1.05rem; }
.tcard .tc-meta { font-size: 0.8rem; color: var(--ink-3); }
.tcard .tc-foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }

.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--sunk); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.seg.status button[aria-pressed="true"][data-v="confident"] { background: var(--tick); color: var(--card); }
.seg.status button[aria-pressed="true"][data-v="learning"] { background: var(--jac); color: var(--on-jac); }

/* ─── Topic page ─── */
.crumbs { font-size: 0.85rem; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--ink-3); }
.topic-head { display: grid; gap: 12px; }
.topic-head .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.section { display: grid; gap: 14px; }
.section > h2 { display: flex; align-items: baseline; gap: 10px; }
.section > h2 .count { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-3); font-weight: 500; }
.ideas { display: grid; gap: 10px; list-style: none; padding: 0; }
.ideas li { padding-left: 22px; position: relative; max-width: 70ch; }
.ideas li::before { content: ""; position: absolute; left: 4px; top: 0.62em; width: 8px; height: 8px; border-radius: 2px; background: var(--jac); transform: rotate(45deg); }
.phys-page .ideas li::before { background: var(--sci); }

.videos { display: grid; gap: 10px; }
.video {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  text-decoration: none; color: var(--ink);
}
.video:hover { border-color: var(--red); }
.video .play { width: 42px; height: 30px; border-radius: 8px; background: var(--red); display: grid; place-items: center; flex: none; }
.video .play svg { width: 14px; height: 14px; fill: var(--card); }
.video .v-title { font-weight: 600; font-size: 0.95rem; line-height: 1.35; }
.video .v-note { font-size: 0.83rem; color: var(--ink-3); }
.video .v-cta { font-size: 0.82rem; font-weight: 600; color: var(--jac-ink); white-space: nowrap; }
.video.seen .play { background: var(--tick); }
@media (max-width: 520px) { .video { grid-template-columns: auto minmax(0, 1fr); } .video .v-cta { grid-column: 2; } }

.defs { display: grid; gap: 10px; }
.def { padding: 12px 14px; border-radius: 12px; background: var(--sunk); }
.def b { display: block; font-family: var(--f-display); font-size: 1rem; margin-bottom: 2px; }

.formulas { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.frow { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.frow:first-child { border-top: 0; }
.frow .f-label { font-size: 0.86rem; color: var(--ink-2); font-weight: 500; }
.frow .f-math { font-family: var(--f-math); font-size: 1.12rem; line-height: 1.8; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 640px) { .frow { grid-template-columns: minmax(0, 1fr) auto; } .frow .f-math { grid-column: 1 / -1; grid-row: 2; } }

.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; line-height: 1.25; }
.fr > span { padding: 0 3px; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; }
.rt { white-space: nowrap; }
.rt > span { border-top: 1.5px solid currentColor; padding: 0 2px; margin-left: 1px; }
.f-math sup, .memo sup { font-size: 0.7em; }

.steps { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; max-width: 72ch; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--jac-soft); color: var(--jac-ink); font-weight: 700; font-size: 0.85rem; display: grid; place-items: center; font-family: var(--f-mono); }
.phys-page .steps li::before { background: var(--sci-soft); color: var(--sci-ink); }

/* Worked examples look like a page from an exam answer book: ruled lines,

/* Progress follows the learner between devices when the page is opened
   inside Claude (private per-person store). Anywhere else it stays in this
   browser, with a backup code in Settings. */
const Sync = {
  ref: null,
  status: "local",
  busy: false,
  again: false,
  timer: 0,
  async init() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return;
    try {
      const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.ref = db.doc(`data/users/${uid}/progress`);
      await this.pull(true);
      if (this.ref) this.status = "synced";
      paintSync();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") this.pull(false);
      });
    } catch {
      this.ref = null;
      this.status = "local";
    }
  },
  async pull(first) {
    if (!this.ref || this.busy) return;
    try {
      const snap = await this.ref.get();
      const d = snap.exists ? snap.data() : null;
      let remote = null;
      try {
        remote = d && typeof d.json === "string" ? JSON.parse(d.json) : null;
      } catch {
        remote = null;
      }
      const rT = remote ? Number(remote.updatedAt) || 0 : 0;
      if (remote && rT > S.updatedAt) {
        S = normalize(remote);
        writeJSON(STORE_KEY, S);
        render(true);
      } else if (S.updatedAt > rT && (first || S.updatedAt - rT > 0)) {
        this.schedule(0);
      }
    } catch {
      /* stay on local data */
    }
  },
  schedule(delay = 1500) {
    if (!this.ref) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), delay);
  },
  async push() {
    if (!this.ref) return;
    if (this.busy) {
      this.again = true;
      return;
    }
    this.busy = true;
    try {
      await this.ref.set({ json: JSON.stringify(S), updatedAt: S.updatedAt });
      this.status = "synced";
    } catch (e) {
      if (e && e.code === "invalid_argument") {
        this.ref = null;
        this.status = "local";
      } else this.status = "retry";
    }
    this.busy = false;
    paintSync();
    if (this.again) {
      this.again = false;
      this.schedule(400);
    } else if (this.status === "retry") this.schedule(8000);
  },
};
function syncLabel() {
  if (Sync.status === "synced") return "Progress saved to your Claude account";
  if (Sync.status === "retry") return "Saved on this device, syncing when possible";

}

  $$("[data-nav]").forEach((a) => {
    const k = a.dataset.nav;
    const cur = k === navKey || (k === "more" && a.closest(".tabbar") && moreKeys.includes(navKey));
    if (cur) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  if (keepScroll || same) {
    window.scrollTo(0, y);
    if (focusId) {
      const f = document.getElementById(focusId);
      if (f) f.focus({ preventScroll: true });
    }
  } else {
    window.scrollTo(0, 0);
  }
  lastRoute = key;
  after(view, same);
  tick();
}
function rerender() {
  render(true);
}
function after(view, same) {
  $$(".mini").forEach(wireMini);
  if (view.name === "pp" && !same) {
    const row = document.getElementById("row-" + view.arg.replace(/\./g, "-"));
    if (row) {
      row.scrollIntoView({ block: "center" });
      row.classList.add("flash");
      setTimeout(() => row.classList.remove("flash"), 2200);
    }
  }
}
function toast(msg, ms = 4200) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast" role="status">${msg}</div>`;
  clearTimeout(toast.t);

}

/* ───────────────────────── Today ───────────────────────── */
function branchSvg() {
  const W = 720,
    H = 150;
  const P = (t) => {
    // gentle rising curve: cubic Bézier from bottom-left to top-right
    const p0 = [18, 118],
      p1 = [220, 150],
      p2 = [470, 20],
      p3 = [704, 44];
    const u = 1 - t;
    return [
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
    ];
  };
  const today = todayIndex();
  let twigs = "",
    blooms = "";
  for (let n = 1; n <= PLAN_LEN; n++) {
    const t = 0.03 + ((n - 1) / (PLAN_LEN - 1)) * 0.94;
    const [x, y] = P(t);
    const side = n % 2 ? -1 : 1;
    const bx = x + side * 4;
    const by = y + side * 24;
    twigs += `<path class="twig" d="M${x.toFixed(1)} ${y.toFixed(1)} Q ${(x + side * 6).toFixed(1)} ${(y + side * 10).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}"/>`;
    const pr = dayProgress(n);
    const st = pr.done === pr.total ? "done" : pr.done ? "part" : "none";
    const lab = `Day ${n}, ${fmtDate(dayDate(n))}: ${pr.done} of ${pr.total} tasks done${n === today ? " (today)" : ""}`;
    blooms += `<g class="bl ${st}${n === today ? " today" : ""}" role="link" tabindex="0" aria-label="${esc(lab)}" data-act="open-day" data-day="${n}"><title>${esc(lab)}</title><circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="18" fill="transparent"/>${n === today ? `<circle class="ring" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="17"/>` : ""}${blossom(+bx.toFixed(1), +by.toFixed(1), 11, "")}</g>`;
  }
  return `<svg class="branch" viewBox="0 0 ${W} ${H + 10}" role="group" aria-label="Your 25 days as jacaranda blossoms">
    <path class="stem" d="M18 118 C 220 150, 470 20, 704 44"/>${twigs}${blooms}</svg>`;
}

function taskRow(n, i, t) {
  const id = taskId(n, i);
  const done = !!S.tasks[id];

function meter(label, done, total, cls = "") {
  const w = total ? Math.round((done / total) * 100) : 0;
  return `<div class="meter ${cls}"><div class="m-top"><span>${label}</span><b class="num">${done} / ${total}</b></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" aria-label="${esc(label)}"><i style="width:${w}%"></i></div></div>`;
}

function scoreMini(subj, p) {
  const all = S.attempts.filter((a) => a.key.endsWith(`.${subj}.${p}`)).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id));
  const data = all.slice(-8);
  const colour = subj === "maths" ? "var(--jac)" : "var(--sci)";
  const name = paperName(subj, p);
  if (!data.length)
    return `<div class="mini"><h4>${name}</h4><div class="big muted">–</div><p class="small muted">No scores yet. Log one on the Past papers page.</p></div>`;
  const W = 200,
    H = 118,
    x0 = 30,
    x1 = 194,
    yTop = 16,
    yBot = 96;
  const yOf = (v) => yBot - (v / 100) * (yBot - yTop);
  const band = (x1 - x0) / Math.max(data.length, 4);
  const bw = Math.min(24, band * 0.62);
  let grid = "";
  [0, 50, 100].forEach((v) => {
    grid += `<line class="grid-l" x1="${x0}" x2="${x1}" y1="${yOf(v)}" y2="${yOf(v)}"/><text class="ax" x="${x0 - 6}" y="${yOf(v) + 3}" text-anchor="end">${v}%</text>`;
  });
  let cols = "";
  data.forEach((a, i) => {
    const v = pct(a.score, a.total || 150);
    const cx = x0 + band * i + band / 2;
    const x = cx - bw / 2;
    const y = yOf(Math.max(v, 1));
    const h = yBot - y;
    const r = Math.min(4, h, bw / 2);
    const path = `M${x} ${yBot} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} L${x + bw - r} ${y} Q${x + bw} ${y} ${x + bw} ${y + r} L${x + bw} ${yBot} Z`;
    const sess = a.key.split(".")[0];
    const tipText = `${SESS[sess] ? SESS[sess].label : sess} · ${a.score}/${a.total || 150} (${v}%) · ${fmtDate(a.date, { day: "numeric", month: "short" })}`;
    cols += `<g class="col" tabindex="0" data-tip="${esc(tipText)}" data-x="${cx}" data-y="${y}"><rect class="hit" x="${cx - band / 2}" y="${yTop}" width="${band}" height="${yBot - yTop}"/><path class="m" d="${path}" fill="${colour}"/></g>`;
    if (i === data.length - 1) cols += `<text class="val" x="${cx}" y="${y - 5}" text-anchor="middle">${v}%</text>`;
  });
  const last = data[data.length - 1];
  const lastPct = pct(last.score, last.total || 150);
  const status = lastPct >= 40 ? '<span class="chip good">Above your 40% target</span>' : lastPct >= 30 ? '<span class="chip warn">Passing, aim for 40%</span>' : '<span class="chip bad">Below 30%, keep going</span>';
  return `<div class="mini"><h4>${name}</h4><div class="row between"><div class="big">${lastPct}%</div>${status}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)} scores: ${data.map((a) => pct(a.score, a.total || 150) + "%").join(", ")}">
      ${grid}<line class="pass-l" x1="${x0}" x2="${x1}" y1="${yOf(30)}" y2="${yOf(30)}"/><text class="ax" x="${x1}" y="${yOf(30) - 4}" text-anchor="end">30% pass</text>${cols}
      <text class="ax" x="${x0}" y="${H - 6}">${plural(all.length, "attempt", "attempts")}</text>
    </svg></div>`;
}
function wireMini(box) {
  let tip = null;
  const show = (g) => {
    if (!tip) {
      tip = document.createElement("div");
      tip.className = "tip";
      box.appendChild(tip);
    }
    const svg = box.querySelector("svg");
    const vb = svg.viewBox.baseVal;
    const rect = svg.getBoundingClientRect();
    const bx = box.getBoundingClientRect();
    const sx = rect.width / vb.width;
    tip.textContent = g.dataset.tip;
    tip.style.left = rect.left - bx.left + Number(g.dataset.x) * sx + "px";
    tip.style.top = rect.top - bx.top + Number(g.dataset.y) * sx + "px";
  };
  const hide = () => {
    if (tip) tip.remove();
    tip = null;
  };
  $$(".col", box).forEach((g) => {
    g.addEventListener("pointerenter", () => show(g));
    g.addEventListener("pointerleave", hide);
    g.addEventListener("focus", () => show(g));
    g.addEventListener("blur", hide);
  });
}

  return `<svg viewBox="0 0 200 200" role="img" aria-label="Cyclic quadrilateral ABCD in a circle with centre O">${C}

  <nav class="row between">${prev ? `<a class="btn ghost" href="#t.${prev.id}">← ${esc(prev.name)}</a>` : "<span></span>"}${next ? `<a class="btn ghost" href="#t.${next.id}">${esc(next.name)} →</a>` : ""}</nav>`;

/* ───────────────────────── Papers ───────────────────────── */
function paperRow(s, subj, p) {
  const key = pKey(s.key, subj, p);
  const at = attemptsFor(key);
  const best = at.length ? Math.max(...at.map((a) => a.score)) : null;
  const status = best === null ? '<span class="small muted">Not written yet</span>' : `<span class="chip ${pct(best) >= 30 ? "good" : "bad"}">Best ${best}/150 · ${pct(best)}%</span>`;
  const open = L.logOpen === key;
  const form = open
    ? `<form class="logform" data-form="log" data-key="${key}">
      <label class="lbl">Your mark out of 150<input class="input n3" type="number" inputmode="numeric" min="0" max="150" step="1" id="score-${key.replace(/\./g, "-")}" required></label>
      <label class="lbl">Date written<input class="input" type="date" id="date-${key.replace(/\./g, "-")}" value="${todayYmd()}" max="${todayYmd()}" required></label>
      <div class="row" style="align-self:end"><button class="btn sm" type="submit">Save score</button><button class="btn ghost sm" type="button" data-act="log-close">Cancel</button></div></form>`
    : "";
  return `<div class="prow ${subj}" id="row-${key.replace(/\./g, "-")}">
    <div class="p-name"><i></i>${paperName(subj, p)}</div>
    <div>${status}</div>
    <div class="p-actions">${paperButtons(s.key, subj, p)}<button class="btn ghost sm" data-act="exam-start" data-key="${key}">Timed attempt</button><button class="btn quiet sm" data-act="log-open" data-key="${key}">Log score</button></div>
    ${form}</div>`;
}
VIEWS.papers = () => {
  const subjF = L.pSubj,
    sessF = L.pSess;
  const list = PAPERS.filter((s) => sessF === "all" || s.session === sessF);
  const subjects = subjF === "all" ? ["maths", "phys"] : [subjF];
  const blocks = list
    .map((s) => {
      const rows = [];
      subjects.forEach((subj) => [1, 2].forEach((p) => rows.push(paperRow(s, subj, p))));
      const note =
        s.key === "2017-nov"
          ? '<p class="small muted">Only the Physics P1 link could be confirmed for November 2017. The other papers and memos are on the official DBE page for that year.</p>'
          : s.key === "2026-jun"
          ? '<p class="small muted">For May/June 2026 Physical Sciences, open the papers from the official DBE page.</p>'
          : "";
      return `<section class="session"><div class="session-head"><h2>${esc(s.label)}</h2><a class="small ext" href="${esc(s.page)}" target="_blank" rel="noopener">Official DBE page</a></div>${note}${rows.join("")}</section>`;
    })
    .join("");
  const f = (k, v, label) => `<button data-act="pf" data-k="${k}" data-v="${v}" aria-pressed="${L[k] === v}">${label}</button>`;
  const rowsAll = [...S.attempts].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));
  const table = rowsAll.length
    ? `<div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Paper</th><th>Session</th><th>Score</th><th>%</th><th></th></tr></thead><tbody>${rowsAll
        .map((a) => {
          const [sess, subj, p] = a.key.split(".");
          return `<tr><td>${fmtDate(a.date, { day: "numeric", month: "short" })}</td><td>${paperName(subj, +p)}</td><td>${esc(SESS[sess] ? SESS[sess].label : sess)}</td><td>${a.score}/${a.total || 150}</td><td>${pct(a.score, a.total || 150)}%</td>
          <td><button class="btn quiet sm" data-act="del-attempt" data-id="${a.id}">${L.confirmDel === a.id ? "Tap again to delete" : "Delete"}</button></td></tr>`;
        })
        .join("")}</tbody></table></div>`
    : '<p class="muted">Nothing logged yet. After you mark a paper with its memo, press <b>Log score</b> on that paper.</p>';
  return `<header class="stack"><h1>Past papers</h1>
    <p class="lead">Every November paper from 2017 to 2025, plus the May/June rewrite papers, each with its memo. The links open the official PDFs from the Department of Basic Education. Question papers are in English; memos are bilingual (English and Afrikaans).</p></header>
    <section class="callout"><b>How to mark yourself</b><p class="small">Mark strictly: give yourself a mark only where the memo shows a ✓. If an earlier answer was wrong but you used it correctly later, the memo usually still gives the later marks (CA, consistent accuracy). Write down every question where you lost marks and redo it two days later.</p></section>
    <div class="filters" role="group" aria-label="Filter papers">
      <div class="seg" role="group" aria-label="Subject">${f("pSubj", "all", "Both subjects")}${f("pSubj", "maths", "Maths")}${f("pSubj", "phys", "Physical Sciences")}</div>
      <div class="seg" role="group" aria-label="Session">${f("pSess", "all", "All sessions")}${f("pSess", "nov", "November")}${f("pSess", "jun", "May/June")}${f("pSess", "mar", "Feb/March")}</div>
    </div>
    ${blocks}
    <section class="section"><h2>Your scores</h2>${table}</section>
    <p class="small muted">Paper links come from the DBE's own listings (index updated ${esc(PAPERS_SOURCE.slice(0, 10))}). If a link ever stops working, the “Official DBE page” link on that session always lists the papers.</p>`;
};
VIEWS.pp = () => VIEWS.papers();
// Runs once when a "#pp.<session>.<subject>.<paper>" link is opened: make sure
// the row is visible under the current filters and open its score form.
function enterPaperRow(arg) {
  const [sess, subj] = arg.split(".");
  if (!SESS[sess]) return;
  if (L.pSess !== "all" && L.pSess !== SESS[sess].session) L.pSess = "all";
  if (L.pSubj !== "all" && L.pSubj !== subj) L.pSubj = "all";
  L.logOpen = arg;
  saveLocal();
}

/* ───────────────────────── Drill (flashcards) ───────────────────────── */
let CS = null; // current card session
function deckKnown(dk) {
  const b = S.cards[dk.id] || {};
  return dk.cards.filter((_, i) => b[i] >= 2).length;
}
VIEWS.cards = () => {
  const card = (dk) => `<a class="tcard ${dk.subj}" href="#deck.${dk.id}"><div class="row between"><span class="eyebrow">${dk.subj === "maths" ? "Maths" : "Physical Sciences"}</span><span class="small muted num">${dk.cards.length} cards</span></div>
    <h3>${esc(dk.name)}</h3><p class="small muted">${esc(dk.blurb)}</p>${meter("Known", deckKnown(dk), dk.cards.length, dk.subj === "phys" ? "phys" : "")}</a>`;
  return `<header class="stack"><h1>Drill</h1><p class="lead">Definitions and must-know facts are free marks: no calculation, just recall. Ten minutes a day is enough if you do it every day.</p></header>
    <div class="tcards">${DECKS.map(card).join("")}</div>
    <p class="small muted">How it works: say the answer out loud, flip the card, then be honest. Cards you get wrong come back first next time.</p>`;
};
function startDeck(id) {
  const dk = DECK[id];
  const b = S.cards[id] || {};
  const order = dk.cards.map((_, i) => i).sort((a, c) => (b[a] || 0) - (b[c] || 0) || Math.random() - 0.5);
  CS = { id, order, pos: 0, flipped: false, got: 0, again: 0 };
}
VIEWS.deck = (id) => {
  const dk = DECK[id];
  if (!dk) return VIEWS.cards();
  if (!CS || CS.id !== id) startDeck(id);
  const b = S.cards[id] || {};
  const head = `<nav class="crumbs"><a href="#cards">Drill</a><span>›</span><span>${esc(dk.name)}</span></nav>
    <header class="stack"><h1>${esc(dk.name)}</h1>${meter("Known", deckKnown(dk), dk.cards.length, dk.subj === "phys" ? "phys" : "good")}</header>`;
  if (CS.pos >= CS.order.length) {
    return `${head}<section class="card stack-lg" style="text-align:center;justify-items:center"><h2>Round done</h2>
      <p class="lead">${CS.got} got it · ${CS.again} to practise again</p>
      <div class="row"><button class="btn" data-act="deck-again">Go again</button><a class="btn ghost" href="#cards">All decks</a></div></section>`;
  }
  const i = CS.order[CS.pos];
  const c = dk.cards[i];
  const box = b[i] || 0;
  const topic = c.topic ? TOPIC[c.topic] : null;
  return `${head}
  <p class="small muted num">Card ${CS.pos + 1} of ${CS.order.length}</p>
  <div class="flash" data-act="flip" role="button" tabindex="0" aria-label="Flip card" id="flashcard">
    ${CS.flipped ? `<span class="side">Answer</span><div class="front" style="font-size:1.05rem">${c.f}</div><div class="back">${c.b}</div>` : `<span class="side">${dk.id.endsWith("defs") ? "Define" : "Question"}</span><div class="front">${c.f}</div><span class="small muted">Tap or press space to flip</span>`}
    <div class="boxes" aria-label="Known level ${box} of 3"><i class="${box >= 1 ? "on" : ""}"></i><i class="${box >= 2 ? "on" : ""}"></i><i class="${box >= 3 ? "on" : ""}"></i></div>
  </div>
  <div class="row" style="justify-content:center">${
    CS.flipped
      ? `<button class="btn danger" data-act="card" data-v="again">Again (1)</button><button class="btn" data-act="card" data-v="got" style="background:var(--tick)">Got it (2)</button>`
      : `<button class="btn" data-act="flip">Show answer</button>`
  }</div>
  ${topic ? `<p class="small muted" style="text-align:center">From <a href="#t.${topic.id}">${esc(topic.name)}</a></p>` : ""}
  <details><summary class="small">See the whole deck as a list</summary><div class="defs" style="margin-top:12px">${dk.cards.map((x) => `<div class="def"><b>${x.f}</b>${x.b}</div>`).join("")}</div></details>`;
};

/* ───────────────────────── Exam game plan ───────────────────────── */
VIEWS.strategy = () => {
  const tgt = (key, title) => {
    const rows = TARGETS[key];
    const sumT = rows.reduce((m, r) => m + r[1], 0);
    const sumA = rows.reduce((m, r) => m + r[2], 0);
    return `<div class="stack"><h3>${title}</h3><div class="table-wrap"><table class="data"><thead><tr><th>Where the marks are</th><th>About</th><th>Your target</th></tr></thead><tbody>${rows
      .map((r) => `<tr><td>${r[3] ? `<a href="#t.${r[3]}">${esc(r[0])}</a>` : esc(r[0])}</td><td>${r[1]}</td><td><b>${r[2]}</b></td></tr>`)
      .join("")}<tr><td><b>Total</b></td><td>≈ ${sumT}</td><td><b>${sumA} / 150 = ${pct(sumA)}%</b></td></tr></tbody></table></div></div>`;
  };
  return `<header class="stack"><h1>Exam game plan</h1>
    <p class="lead">You don't need to know everything. You need to collect enough marks, on purpose. This page is how.</p></header>
    <section class="section"><h2>What passing takes</h2>
      <p style="max-width:70ch">The pass mark is 30% for each subject. Both papers together are out of 300, so you need about <b>90 marks across both papers</b>. Aim for <b>60 out of 150 (40%) on each paper</b>; that gives you room for a bad question or a hard paper. Last time you had 15% in Maths and 26% in Physical Sciences. Physical Sciences needs about 20 more marks per paper. Maths needs about 40 more per paper, and the targets below show exactly where they come from.</p></section>

/* ───────────────────────── Focus timer ───────────────────────── */
function focusRemaining() {
  const f = L.focus;
  if (!f) return null;
  return f.running ? f.endsAt - Date.now() : f.remaining;
}
VIEWS.focus = () => {
  const f = L.focus;
  const len = L.focusLen === 50 ? 50 : 25;
  const subj = f ? f.subj : L.focusSubj;
  const phase = f ? f.phase : "focus";
  const total = f ? f.total : len * 60000;
  const rem = f ? focusRemaining() : total;
  const circ = 2 * Math.PI * 88;
  const off = circ * (1 - Math.max(0, rem) / total);
  const mins = S.minutes[todayYmd()] || {};
  let week = 0;
  for (let k = 0; k < 7; k++) {

  return `<header class="stack"><h1>Focus timer</h1><p class="lead">Work for a fixed time with your phone face down, then take a real break. The minutes count towards your daily total.</p></header>

        <div class="clock" data-clock="focus" role="timer" aria-live="off">${clockText(rem)}</div>
      </div>
      <p class="muted">${phase === "break" ? "Break. Stand up, drink water, look out of a window." : f ? `Focusing on ${subj === "maths" ? "Maths" : "Physical Sciences"}` : "Ready when you are"}</p>
      <div class="row" style="justify-content:center">${
        !f
          ? `<button class="btn" data-act="focus-start">Start focus</button>`
          : `${f.running ? `<button class="btn" data-act="focus-pause">Pause</button>` : `<button class="btn" data-act="focus-resume">Resume</button>`}<button class="btn ghost" data-act="focus-stop">${phase === "break" ? "Skip break" : "Stop"}</button>`
      }</div>
    </section>

    <div class="card stack"><h2>Last 7 days</h2><p class="num">${hm(week)} of focused study</p></div></section>
    <p class="small muted">A full focus block is logged when it finishes. A chime plays at the end (turn your volume up).</p>`;
};
function chime() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = chime.ctx || (chime.ctx = new Ctx());
    [660, 880, 990].forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = f;
      o.type = "sine";
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.22);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i * 0.22 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.22 + 0.6);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.22);
      o.stop(ctx.currentTime + i * 0.22 + 0.65);
    });
  } catch {
    /* sound is optional */
  }
}
function focusFinishPhase() {
  const f = L.focus;
  if (!f) return;
  if (f.phase === "focus") {
    const d = todayYmd();
    const m = S.minutes[d] || (S.minutes[d] = {});
    m[f.subj] = (m[f.subj] || 0) + f.len;
    commit();
    const brk = f.len === 50 ? 10 : 5;
    L.focus = { subj: f.subj, len: f.len, phase: "break", total: brk * 60000, endsAt: Date.now() + brk * 60000, running: true };
    toast(`Nice. ${f.len} minutes of ${f.subj === "maths" ? "Maths" : "Physical Sciences"} logged. Take a ${brk}-minute break.`);
  } else {
    L.focus = null;
    toast("Break's over. Start the next focus block when you're ready.");
  }
  saveLocal();
  chime();
  if (parseHash().name === "focus") rerender();
}

/* ───────────────────────── ticking clocks ───────────────────────── */
function tick() {
  const f = L.focus;
  if (f && f.running && f.endsAt - Date.now() <= 0) focusFinishPhase();
  const fr = focusRemaining();
  $$('[data-clock="focus"]').forEach((el) => (el.textContent = clockText(fr === null ? (L.focusLen === 50 ? 50 : 25) * 60000 : fr)));
  $$("[data-ring]").forEach((c) => {
    const circ = Number(c.dataset.ring);
    const total = Number(c.dataset.total);
    const r = fr === null ? total : fr;
    c.setAttribute("stroke-dashoffset", (circ * (1 - Math.max(0, r) / total)).toFixed(1));
  });
  const e = L.exam;
  const examRem = e ? EXAM_MS - examElapsed() : 0;
  $$('[data-clock="exam"]').forEach((el) => (el.textContent = clockText(examRem)));
  if (e && examRem <= 0 && !e.done) {
    e.done = true;
    saveLocal();
    chime();
    toast("Time's up. Pens down, then mark it with the memo.", 8000);
  }
  let chip = "";
  if (e) chip = `<button class="timer-chip exam" data-act="exam-show" aria-label="Exam timer">${clockText(examRem)} left</button>`;
  else if (f) chip = `<a class="timer-chip" href="#focus" aria-label="Focus timer">${f.phase === "break" ? "Break " : ""}${clockText(fr)}</a>`;
  ["top-chip", "rail-chip"].forEach((id) => {
    const el = document.getElementById(id);
    if (el && el.innerHTML !== chip) el.innerHTML = chip;
  });
}

    el.className = "falling";

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3400);
  }
  toast(`Day ${n} done. They say if a jacaranda flower falls on you, you'll pass. You're not leaving it to luck.`, 6500);
}

document.addEventListener("keydown", (e) => {
  const el = e.target;
  if ((e.key === "Enter" || e.key === " ") && el.getAttribute && el.getAttribute("role") && el.dataset.act) {
    e.preventDefault();
    ACT[el.dataset.act] && ACT[el.dataset.act](el);
    return;
  }
  if (parseHash().name === "deck" && CS && !/INPUT|TEXTAREA|SELECT/.test(el.tagName)) {
    if (e.key === " " && el.id !== "flashcard") {
      e.preventDefault();
      ACT.flip();
    } else if (CS.flipped && e.key === "1") ACT.card({ dataset: { v: "again" } });
    else if (CS.flipped && e.key === "2") ACT.card({ dataset: { v: "got" } });
  }
  if (e.key === "Escape" && document.querySelector(".overlay")) closeOverlay();
});
document.addEventListener("submit", (e) => {
  const form = e.target;
  const kind = form.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (kind === "exam-date") {
    const v = $("#first-exam").value;
    if (!isYmd(v)) return toast("Choose a date first.");
    S.examDate = v;
    S.examConfirmed = true;
    commit();
    toast(`Saved. Day 25 is now ${fmtDate(addDays(v, -1), { weekday: "long", day: "numeric", month: "long" })}.`);
    rerender();
  } else if (kind === "log") {
    const key = form.dataset.key;
    const id = key.replace(/\./g, "-");
    const score = Number($("#score-" + id).value);
    const date = $("#date-" + id).value;
    if (!Number.isInteger(score) || score < 0 || score > 150) return toast("Enter a whole-number mark between 0 and 150.");
    S.attempts.push({ id: Date.now(), key, score, total: 150, date: isYmd(date) ? date : todayYmd() });
    L.logOpen = null;
    saveLocal();
    commit();
    const p = pct(score);
    toast(p >= 40 ? `${p}%. That's above your 40% target. Keep this up.` : p >= 30 ? `${p}%. That's a pass. Now push for 40%: redo the questions you lost marks on.` : `${p}%. Every paper you mark shows you exactly which marks to go after next. Redo the questions you lost marks on in two days.`, 7000);
    rerender();
  } else if (kind === "settings") {
    const exam = $("#set-exam").value;
    if (!isYmd(exam)) return toast("Choose the date of your first exam.");
    S.name = $("#set-name").value.trim().slice(0, 40);
    S.examDate = exam;
    S.examConfirmed = true;
    $$("[data-pd]").forEach((inp) => (S.paperDates[inp.dataset.pd] = isYmd(inp.value) ? inp.value : ""));
    commit();
    toast("Settings saved.");
    rerender();
  }
});
window.addEventListener("hashchange", () => render());

/* ───────────────────────── boot ───────────────────────── */
function start() {
  shell();
  render();
  if (L.exam && !L.exam.done && EXAM_MS - examElapsed() > 0) {
    /* the chip in the header lets the learner reopen a running attempt */
  }
  setInterval(tick, 1000);
  Sync.init();
}
start();

</script>
</body>
</html>
